name: Scraper rapido (Tier 1, loop continuo)

# Un job corre ~55 min y repite el scraping cada ~2.5 min adentro (ver
# run_tier1_loop.py). El cron solo lo relanza; `concurrency` encola los
# lanzamientos para que se ejecuten uno atras del otro sin huecos ni solapes.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: tier1-loop
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Configurar git
        run: |
          git config user.name "apartment-scraper-bot"
          git config user.email "actions@github.com"

      - name: Correr Tier 1 en loop
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_tier1_loop.py

      - name: Guardar estado pendiente (por si el loop se corto)
        if: always()
        continue-on-error: true   # es una red de seguridad: si falla, no marca el job como roto
        run: |
          git add seen_listings.json
          [ -f health.json ] && git add health.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Actualizar anuncios vistos [skip ci]"
          fi
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "intento $i fallo, reintento en 5s"
            sleep 5
          done
          echo "no se pudo pushear el estado pendiente"
