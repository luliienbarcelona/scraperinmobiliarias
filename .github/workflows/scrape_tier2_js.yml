name: Scraper Tier 2 JS (inmobiliarias que necesitan navegador, cada 30 min)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt -r requirements-js.txt

      - name: Instalar Chromium para Playwright
        run: playwright install --with-deps chromium

      - name: Correr Tier 2 (JS)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main_tier2_js.py

      - name: Guardar resultados ya vistos y registro
        run: |
          git config user.name "apartment-scraper-bot"
          git config user.email "actions@github.com"
          git add seen_tier2.json agencies.json
          git diff --staged --quiet || git commit -m "Actualizar Tier 2 JS [skip ci]"
          git pull --rebase origin main
          git push
