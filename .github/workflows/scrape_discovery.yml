name: Discovery (busca inmobiliarias nuevas, 2 veces por dia)

on:
  schedule:
    - cron: "0 7,19 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Buscar inmobiliarias nuevas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python main_discovery.py

      - name: Guardar registro actualizado
        run: |
          git config user.name "apartment-scraper-bot"
          git config user.email "actions@github.com"
          git add agencies.json
          git diff --staged --quiet || git commit -m "Actualizar registro de inmobiliarias [skip ci]"
          git pull --rebase origin main
          git push
