name: Probe (diagnostico temporal)
on:
  workflow_dispatch:
    inputs:
      urls:
        description: URLs separadas por espacio
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-js.txt
      - run: playwright install --with-deps chromium
      - name: Sondear
        env:
          PROBE_URLS: ${{ github.event.inputs.urls }}
        run: python probe_site.py $PROBE_URLS || true
      - name: Guardar resultado
        run: |
          git config user.name "apartment-scraper-bot"
          git config user.email "actions@github.com"
          git add probe_out
          git commit -m "probe output [skip ci]" || exit 0
          git pull --rebase origin main
          git push
