name: Probe (diagnostico temporal)
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL a sondear
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Sondear
        env:
          PROBE_URL: ${{ github.event.inputs.url }}
        run: python probe_site.py "$PROBE_URL"
      - name: Guardar resultado
        run: |
          git config user.name "apartment-scraper-bot"
          git config user.email "actions@github.com"
          git add probe_out
          git commit -m "probe output [skip ci]" || exit 0
          git pull --rebase origin main
          git push
