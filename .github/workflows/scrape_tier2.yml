name: Scraper Tier 2 (mas inmobiliarias, cada 15 min)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Correr Tier 2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main_tier2.py

      - name: Guardar resultados ya vistos y registro
        run: |
          git config user.name "apartment-scraper-bot"
          git config user.email "actions@github.com"
          git add seen_tier2.json agencies.json
          [ -f sitemap_seen.json ] && git add sitemap_seen.json || true
          git diff --staged --quiet || git commit -m "Actualizar Tier 2 [skip ci]"
          git pull --rebase origin main
          git push
