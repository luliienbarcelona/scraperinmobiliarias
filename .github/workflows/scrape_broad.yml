name: Scraper amplio (busqueda en todas las inmobiliarias via Brave)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Correr busqueda amplia
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python main_broad.py

      - name: Guardar resultados ya vistos
        run: |
          git config user.name "apartment-scraper-bot"
          git config user.email "actions@github.com"
          git pull --rebase origin main
          git add seen_broad.json
          git diff --staged --quiet || git commit -m "Actualizar anuncios vistos (amplio) [skip ci]"
          git push
